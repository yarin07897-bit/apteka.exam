version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apteka.exam
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  web:
    build: .
    container_name: fastapi_app
    restart: always
    ports:
      - "8050:8050"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/apteka.exam
    depends_on:
      - db
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: